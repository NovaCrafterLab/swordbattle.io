# ./docker-compose.yml                # root

version: '3.9'

###############################################################################
# anchors ─ reusable blocks
###############################################################################
x-logging: &log-common
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

x-resources-512m: &res-512
  deploy:
    resources:
      limits:
        cpus: '1.5'
        memory: 512M
      reservations:
        memory: 256M

x-resources-256m: &res-256
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 256M
      reservations:
        memory: 128M

x-common-net: &net-common
  <<: *log-common
  restart: unless-stopped
  networks: [backnet]

x-server-common: &server-common
  <<: [*net-common, *res-512]
  build:
    context: .
    dockerfile: docker/server.dockerfile
    target: runtime
  env_file: [./env/server.env.development]
  # environment:
  #   - SERVER_PORT
  #   - API_ENDPOINT
  #   - SERVER_SECRET
  #   - DEBUG
  #   - RECAPTCHA_SECRET_KEY
  depends_on:
    api:
      condition: service_started

###############################################################################
# services
###############################################################################
services:
  db:
    <<: *net-common
    image: postgres:16-alpine
    env_file: [./env/api.env.development]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      retries: 20

  api:
    <<: [*net-common, *res-512]
    build:
      context: .
      dockerfile: docker/api.dockerfile
      target: runtime
    env_file: [./env/api.env.development]
    # environment:
    #   - API_PORT
    #   - DB_URL
    #   - APP_SECRET
    #   - SERVER_SECRET
    #   - USE_SSL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8090:8080'

  server:
    <<: *server-common
    ports:
      - '8000:8000'

  server-race:
    <<: *server-common
    profiles: ['race']
    env_file: [./env/development.server.race.env]
    ports:
      - '8001:8000'

  client:
    <<: [*net-common, *res-256]
    build:
      context: .
      dockerfile: docker/client.dockerfile
      target: runtime
      args:
        BUILD_ENV: development
    env_file: [./env/client.env.development]
    depends_on: [server]
    ports:
      - '3000:80'

###############################################################################
# volumes & networks
###############################################################################
volumes:
  db_data:

networks:
  backnet:
    driver: bridge
