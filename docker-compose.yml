# ./docker-compose.yml
version: "3.9"

###############################################################################
# anchors
###############################################################################
x-server-common: &server-common        # shared config for all server variants
  build:
    context: ./server
    target: runtime
  env_file:
    - ./env/server.env.development
  environment:
    - SERVER_PORT
    - API_ENDPOINT
    - SERVER_SECRET
    - DEBUG
    - RECAPTCHA_SECRET_KEY
  depends_on:
    api:
      condition: service_started
  restart: unless-stopped
  networks: [backnet]
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

###############################################################################
# services
###############################################################################
services:
  db:                                  # postgres
    image: postgres:16-alpine
    env_file:
      - ./env/api.env.development
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [backnet]

  api:                                 # backend API
    build:
      context: ./api
      target: runtime
    env_file:
      - ./env/api.env.development
    environment:
      - API_PORT
      - DB_URL
      - APP_SECRET
      - SERVER_SECRET
      - USE_SSL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks: [backnet]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

  server:                              # main server
    <<: *server-common
    ports:
      - "8000:8000"

  server-race:                         # race server (profile)
    <<: *server-common
    profiles: ["race"]                 # disabled by default
    env_file:
      - ./env/development.server.race.env
    ports:
      - "8001:8000"

  client:                              # React frontend
    build:
      context: ./client
      target: runtime
      args:
        REACT_APP_API: ${REACT_APP_API}
        REACT_APP_ENDPOINT_DEV: ${REACT_APP_ENDPOINT_DEV}
        REACT_APP_ENDPOINT_TEST: ${REACT_APP_ENDPOINT_TEST}
        REACT_APP_ENDPOINT_RACE: ${REACT_APP_ENDPOINT_RACE}
    env_file:
      - ./env/client.env.development
    depends_on:
      - server
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: [backnet]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          memory: 128M

###############################################################################
# volumes & networks
###############################################################################
volumes:
  db_data:

networks:
  backnet:
    driver: bridge
