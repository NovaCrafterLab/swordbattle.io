# ./docker-compose.prod.yml
services:
  db:
    env_file:
      - ./env/api.env.production
    volumes:
      - db_data:/var/lib/postgresql/data:rw
    environment:
      NODE_ENV: 'production'
    restart: always

  api:
    env_file:
      - ./env/api.env.production
    build:
      args:
        NODE_ENV: 'production'
    environment:
      NODE_ENV: 'production'
    restart: always

  server:
    env_file:
      - ./env/server.env.production
    build:
      args:
        NODE_ENV: 'production'
    environment:
      NODE_ENV: 'production'
    restart: always

  server-race:
    env_file:
      - ./env/production.server.race.env
    build:
      args:
        NODE_ENV: 'production'
    environment:
      NODE_ENV: 'production'
    restart: always

  client:
    env_file:
      - ./env/client.env.production
    build:
      args:
        BUILD_ENV: production
    environment:
      NODE_ENV: 'production'
    restart: always
